trigger:
  branches:
    include:
      - main
      - master

pool:
  vmImage: ubuntu-latest

variables:
  mavenPomFile: 'pom.xml'
  warPath: 'webapp/target/webapp.war'
  imageName: 'hello-world-webapp'

parameters:
  - name: runSonarQube
    displayName: Run SonarQube analysis
    type: boolean
    default: false

steps:
  - task: JavaToolInstaller@0
    displayName: Use Java 17
    inputs:
      versionSpec: '17'
      jdkArchitectureOption: x64
      jdkSourceOption: PreInstalled

  - ${{ if eq(parameters.runSonarQube, true) }}:
    - task: SonarQubePrepare@7
      displayName: Prepare SonarQube analysis
      inputs:
        SonarQube: 'SonarQube'
        scannerMode: 'Other'
        extraProperties: |
          sonar.projectKey=SubuDemo
          sonar.projectName=SubuDemo

  - ${{ if eq(parameters.runSonarQube, true) }}:
    - script: mvn --batch-mode --no-transfer-progress clean verify sonar:sonar -Dsonar.projectKey=SubuDemo
      displayName: Build, test, package and analyze with SonarQube
      env:
        MAVEN_OPTS: '-Xmx1024m'

    - task: SonarQubePublish@7
      displayName: Publish SonarQube quality gate
      inputs:
        pollingTimeoutSec: '300'

  - ${{ if eq(parameters.runSonarQube, false) }}:
    - script: mvn --batch-mode --no-transfer-progress clean verify
      displayName: Build, test and package WAR
      env:
        MAVEN_OPTS: '-Xmx1024m'

  - task: PublishTestResults@2
    displayName: Publish JUnit test results
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: JUnit
      testResultsFiles: '**/target/surefire-reports/TEST-*.xml'
      searchFolder: '$(System.DefaultWorkingDirectory)'
      failTaskOnFailedTests: true
      publishRunAttachments: true

  - task: PublishBuildArtifacts@1
    displayName: Publish WAR artifact
    inputs:
      PathtoPublish: '$(warPath)'
      ArtifactName: 'webapp-war'
      publishLocation: Container

  - script: docker build -t $(imageName):$(Build.BuildId) .
    displayName: Build Docker image
