# For standalone SonarScanner CLI use only. For Maven builds, prefer mvn sonar:sonar.
# Set sonar.projectKey to the key created in your SonarQube server.
sonar.projectKey=SubuDemo
sonar.projectName=SubuDemo
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

# Java and JSP/web resources from both modules (paths relative to repository root)
sonar.sources=server/src/main/java,webapp/src/main/java,webapp/src/main/webapp
sonar.tests=server/src/test/java
sonar.java.binaries=server/target/classes,webapp/target/classes
sonar.java.test.binaries=server/target/test-classes
sonar.java.libraries=**/target/*.jar
